---
efiBootLoader: "grub"
efiBootloaderId: "sable"
installEFIFallback: true
installHybridGRUB: true
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
timeout: 5
kernel: "/vmlinuz"
img: "/initrd.img"
fallback: "/initrd.img"
grubKernelParam: "quiet"
extraInstallParams: ["--recheck"]
