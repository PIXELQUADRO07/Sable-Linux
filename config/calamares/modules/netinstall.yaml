# Software groups installable via network during installation.
# WARNING: non-existent package names will cause installation failure.
# Verify package names in chroot with: apt-cache show <package>
- name: "KDE Plasma - Complete Application Suite"
  description: "Standard KDE Desktop Suite (kde-standard)"
  selected: false
  packages:
    - kde-standard

- name: "Internet & Communication"
  description: "Web Browser"
  selected: true
  packages:
    - firefox-esr

- name: "Office"
  description: "LibreOffice Suite"
  selected: false
  packages:
    - libreoffice-writer
    - libreoffice-calc
    - libreoffice-impress

- name: "Development"
  description: "Compilers and development tools"
  selected: false
  packages:
    - build-essential
    - git
    - cmake
    - gdb
    - clang
    - python3-venv

- name: "Sable Security Tools"
  description: "Cybersecurity and security assessment toolkit"
  selected: false
  expanded: true
  subgroups:
    - name: "Network & Reconnaissance"
      description: "Network scanning and analysis"
      packages:
        - nmap
        - masscan
        - tcpdump
        - wireshark
        - whois
        - dnsenum
        - dnsrecon
        - socat
    - name: "Web Testing"
      description: "Web application security testing"
      packages:
        - sqlmap
        - nikto
        - gobuster
        - ffuf
        - dirb
        - wfuzz
    - name: "Password Audit"
      description: "Password security audit tools"
      packages:
        - john
        - hashcat
        - hydra
        - medusa
    - name: "Wireless Audit"
      description: "Wireless network testing tools"
      packages:
        - aircrack-ng
        - kismet
        - mdk4
        - hcxtools
        - hcxdumptool
    - name: "Forensics"
      description: "Digital forensics and data recovery"
      packages:
        - binwalk
        - foremost
        - sleuthkit
        - testdisk
        - scalpel
