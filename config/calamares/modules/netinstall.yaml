# Gruppi installabili da rete durante l'installazione.
# ATTENZIONE: un nome di pacchetto inesistente fa fallire l'intera installazione.
# Verifica ogni nome nel chroot con:  apt-cache show <pacchetto>
- name: "KDE Plasma - applicazioni complete"
  description: "Suite KDE standard (kde-standard)"
  selected: true
  packages:
    - kde-standard

- name: "Internet e comunicazione"
  description: "Browser web"
  selected: true
  packages:
    - firefox-esr

- name: "Ufficio"
  description: "LibreOffice"
  selected: false
  packages:
    - libreoffice-writer
    - libreoffice-calc
    - libreoffice-impress

- name: "Sviluppo"
  description: "Compilatori e strumenti di sviluppo"
  selected: false
  packages:
    - build-essential
    - git
    - cmake
    - gdb
    - clang
    - python3-venv

- name: "Sable Security Tools"
  description: "Strumenti di sicurezza informatica (uso lecito/autorizzato)"
  selected: false
  expanded: true
  subgroups:
    - name: "Rete e ricognizione"
      description: "Scansione e analisi di rete"
      packages:
        - nmap
        - masscan
        - tcpdump
        - wireshark
        - whois
        - dnsenum
        - dnsrecon
        - socat
    - name: "Web"
      description: "Test di applicazioni web"
      packages:
        - sqlmap
        - nikto
        - gobuster
        - ffuf
        - dirb
        - wfuzz
    - name: "Password"
      description: "Audit di password"
      packages:
        - john
        - hashcat
        - hydra
        - medusa
    - name: "Wireless"
      description: "Audit di reti wireless"
      packages:
        - aircrack-ng
        - kismet
        - mdk4
        - hcxtools
        - hcxdumptool
    - name: "Forensics"
      description: "Analisi forense e recupero dati"
      packages:
        - binwalk
        - foremost
        - sleuthkit
        - testdisk
        - scalpel
