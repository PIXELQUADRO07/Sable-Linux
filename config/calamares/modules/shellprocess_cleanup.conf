---
# Removes live session files, sudoers overrides, installer shortcuts, and dev accounts from target installed system.
dontChroot: false
timeout: 120
script:
  - "rm -f /etc/sddm.conf.d/zz-sable-live-autologin.conf"
  - "rm -f /usr/share/applications/sable-install.desktop"
  - "rm -f /usr/share/applications/sable-installer.desktop"
  - "rm -f /etc/skel/Desktop/sable-installer.desktop"
  - "rm -f /home/*/Desktop/sable-installer.desktop"
  - "rm -f /etc/sudoers.d/00-live"
  - "rm -f /etc/sudoers.d/00-*"
  - "rm -rf /etc/live"
  - "userdel -rf sable 2>/dev/null || true"
  - "userdel -rf live 2>/dev/null || true"
