---
# Removes live session files from target installed system.
dontChroot: false
timeout: 60
script:
  - "rm -f /etc/sddm.conf.d/zz-sable-live-autologin.conf"
  - "rm -f /usr/share/applications/sable-install.desktop"
  - "rm -f /usr/share/applications/sable-installer.desktop"
  - "rm -f /etc/skel/Desktop/sable-installer.desktop"
