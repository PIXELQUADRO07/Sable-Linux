---
# Live-boot mounts the ISO at /run/live/medium (Debian live-boot 12+).
# The older /lib/live/mount/medium path is kept as a fallback.
unpack:
    - source: "/run/live/medium/live/filesystem.squashfs"
      sourcefs: "squashfs"
      destination: ""
    - source: "/lib/live/mount/medium/live/filesystem.squashfs"
      sourcefs: "squashfs"
      destination: ""
      condition: "! test -f /run/live/medium/live/filesystem.squashfs"
