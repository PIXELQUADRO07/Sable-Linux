---
defaultGroups:
    - audio
    - video
    - cdrom
    - dip
    - plugdev
    - netdev
    - sudo
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
mustChangeRootPassword: false
allowWeakPasswords: false
allowWeakPasswordsDefault: false
userShell: /bin/zsh
avatarFilePath: ~/.face
fullnameHostPattern: "^[^ ]{1,40}$"
hostname:
    location: /etc/hostname
    writable: true
    prettyName: false
    forbidden:
        - localhost
        - linux
        - dhcp
        - sable-live
