---
# Sable Linux — Calamares installer sequence
# "local" is /etc/calamares (copied onto the live overlay at ISO build time).
modules-search: [ local ]

instances:
  - id:       live
    module:   packages
    config:   packages-live.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - netinstall
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - removeuser
      - packages@live
      - packages
      - grubcfg
      - bootloader
      - initramfs
      - umount
  - show:
      - finished

branding: sable
prompt-install: false
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
