---
modules-search: [ "$(qt5paths --install-prefix)/lib/calamares/modules", "/usr/lib/calamares/modules" ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - unpack
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - grubcfg
    - bootloader
    - services-systemd
    - removeuser
    - finished
  - show:
    - finished

branding: default
prompt-install: false
dont-chroot: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
