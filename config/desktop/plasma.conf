# ==============================================================================
# Sable Desktop — Plasma Configuration
# ==============================================================================
# Read by desktop.sh. X11 Plasma is the QEMU-safe default (Wayland + -vga std
# often yields a black screen). Wayland remains installed via kde-plasma-desktop.

DESKTOP_ENV="kde-plasma"
DISPLAY_MANAGER="sddm"
DEFAULT_SESSION="plasmax11"
ENABLE_SDDM_SERVICE="true"
