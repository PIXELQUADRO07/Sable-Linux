# live-config (Debian live-boot) — live session identity
# Prevents the default extra "user" account.
LIVE_HOSTNAME="sable"
LIVE_USERNAME="live"
LIVE_USER_FULLNAME="Sable Live"
LIVE_USER_DEFAULT_GROUPS="audio,cdrom,dip,floppy,video,plugdev,netdev,sudo,scanner,bluetooth"
LIVE_LOCALES="en_US.UTF-8"
LIVE_TIMEZONE="UTC"
LIVE_KEYBOARD_LAYOUTS="us"
LIVE_KEYBOARD_MODEL="pc105"
NO_USER=false
