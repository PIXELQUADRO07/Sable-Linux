# ==============================================================================
# Sable Linux — Master Build & Project Configuration
# ==============================================================================
# This file serves as the Single Source of Truth (SSOT) for global settings.
# Subsystem-specific configurations live under config/{base,desktop,branding}/.

# ------------------------------------------------------------------------------
# 1. Distro Identity & Metadata
# ------------------------------------------------------------------------------
SABLE_NAME="Sable Linux"
SABLE_ID="sable"
SABLE_VERSION="0.6.0"
SABLE_CODENAME="Nightfall"
SABLE_VENDOR="Sable Linux Project"
SABLE_URL="https://github.com/PIXELQUADRO07/Sable-Linux"
SABLE_SUPPORT_URL="https://github.com/PIXELQUADRO07/Sable-Linux/issues"
SABLE_BUG_REPORT_URL="https://github.com/PIXELQUADRO07/Sable-Linux/issues"

# ------------------------------------------------------------------------------
# 2. Upstream Platform Settings
# ------------------------------------------------------------------------------
DEBIAN_SUITE="trixie"
DEBIAN_ARCH="amd64"
DEBIAN_MIRROR="https://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="https://deb.debian.org/debian-security"

# ------------------------------------------------------------------------------
# 3. System Defaults (Initial Development Baseline)
# ------------------------------------------------------------------------------
SABLE_INIT="systemd"
SABLE_SHELL="/bin/bash"
SABLE_DEFAULT_HOSTNAME="sable"
SABLE_DEFAULT_LOCALE="en_US.UTF-8"
SABLE_EXTRA_LOCALES="it_IT.UTF-8"
SABLE_DEFAULT_TIMEZONE="UTC"
SABLE_DEFAULT_KEYBOARD="us"
SABLE_DEFAULT_USER="sable"

# Live ISO session (live-config). Removed from the installed system by Calamares.
SABLE_LIVE_USER="live"

# ------------------------------------------------------------------------------
# 4. Profile & Desktop Environment
# ------------------------------------------------------------------------------
# SABLE_PROFILE determines which configuration sets are loaded during build:
# - "base": minimal CLI environment
# - "desktop": desktop profile with kde-plasma-desktop
SABLE_PROFILE="desktop"
SABLE_DESKTOP="kde"
SABLE_DISPLAY_MANAGER="sddm"

# ------------------------------------------------------------------------------
# 5. Networking & Services
# ------------------------------------------------------------------------------
SABLE_NETWORK_MANAGER="network-manager"
SABLE_ENABLE_SSH="false"
SABLE_ALLOW_ROOT_LOGIN="false"

# ------------------------------------------------------------------------------
# 6. Build Artifacts
# ------------------------------------------------------------------------------
# The live ISO is the release deliverable. sable.img is a development disk.
SABLE_IMAGE_SIZE="16G"
SABLE_BUILD_ISO="true"
SABLE_BUILD_IMAGE="false"
